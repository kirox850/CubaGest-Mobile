name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fix dependency versions for this Expo SDK
        run: npx expo install --fix

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Remove SplashScreen storyboard from Xcode project
        run: |
          cd ios
          sed -i '' '/SplashScreen\.storyboard/d' CubaGest.xcodeproj/project.pbxproj
          rm -f CubaGest/SplashScreen.storyboard
          /usr/libexec/PlistBuddy -c "Delete :UILaunchStoryboardName" CubaGest/Info.plist 2>/dev/null || true
          echo "✅ SplashScreen eliminado"

      - name: Replace AppIcon with empty placeholder
        run: |
          rm -rf ios/CubaGest/Images.xcassets/AppIcon.appiconset
          mkdir -p ios/CubaGest/Images.xcassets/AppIcon.appiconset
          cat > ios/CubaGest/Images.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {
            "images": [],
            "info": { "version": 1, "author": "xcode" }
          }
          EOF
          echo "✅ AppIcon vaciado"

      - name: Clear Xcode DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Find workspace and scheme
        id: find
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "✅ Workspace: $WORKSPACE | Scheme: $SCHEME"

      - name: Archive (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            archive 2>&1 | tee build.log
          ls -la build/ || echo "build/ no existe"

      - name: Show build log tail on failure
        if: failure()
        run: tail -n 100 build.log || echo "No se encontró build.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/App.xcarchive -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r ../CubaGest-unsigned.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: CubaGest-unsigned-ipa
          path: CubaGest-unsigned.ipa
