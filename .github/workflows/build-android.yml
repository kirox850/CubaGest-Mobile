name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android project
        run: |
          npx react-native@0.74.5 init temp_project --version 0.74.5 --skip-install
          cp -r temp_project/android .
          rm -rf temp_project

      - name: Install dependencies
        run: npm install

      - name: Generate JS bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Debug outputs
        run: |
          echo "=== Listing APK outputs ==="
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APKs found"
          echo "=== Full outputs tree ==="
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "No outputs directory"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubaGest-Android-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
