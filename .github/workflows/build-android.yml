name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (genera carpeta android/)
        run: npx expo prebuild --platform android --clean
        env:
          # No se necesita cuenta Expo para prebuild
          CI: '1'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK debug (sin firmar, para pruebas)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubaGest-Android-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build info
        run: |
          echo "✅ APK generado en artifacts"
          echo "📱 Para instalar: Ajustes → Seguridad → Fuentes desconocidas → instalar APK"
