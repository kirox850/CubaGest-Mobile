name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Fix Kotlin version in gradle
        run: |
          # Forzar Kotlin 1.9.x compatible con react-native-screens 3.x
          sed -i 's/kotlinVersion = "2\.[0-9]\+\.[0-9]\+"/kotlinVersion = "1.9.25"/' android/build.gradle || true
          sed -i 's/kotlin_version = "2\.[0-9]\+\.[0-9]\+"/kotlin_version = "1.9.25"/' android/build.gradle || true
          # Mostrar la versión resultante
          grep -i kotlin android/build.gradle | head -5 || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubaGest-Android-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
