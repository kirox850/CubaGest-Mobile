name: Build Android APK

# Solo corre cuando tú lo disparas a mano desde la pestaña Actions de
# GitHub ("Run workflow") — NO en cada push a main. Un build de APK tarda
# varios minutos y no siempre quieres uno por cada commit.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies (CI)
        run: npm ci

      # Genera el proyecto android nativo desde app.json + dependencias de
      # Expo (SDK 57 / RN 0.81), la vía oficial. Sustituye al antiguo
      # "react-native@0.74.5 init" cuya plantilla era incompatible con el JS.
      # Va DESPUÉS de npm ci para que npx use el CLI expo local (SDK 57).
      - name: Generate Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # En release, Gradle empaqueta el JS solo (tarea bundleReleaseJsAndAssets):
      # no hace falta un paso manual de react-native bundle.
      - name: Build APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Debug outputs
        run: |
          echo "=== Listing APK outputs ==="
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APKs found"
          echo "=== Full outputs tree ==="
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "No outputs directory"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubaGest-Android-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
